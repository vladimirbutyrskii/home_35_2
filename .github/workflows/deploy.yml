name: CI/CD Pipeline

on:
  push:
    branches: [ feature/home_35_2 ]
  pull_request:
    branches: [ feature/home_35_2 ]

# !!! ДОБАВЬТЕ ЭТОТ БЛОК НА УРОВНЕ WORKFLOW !!!
permissions:
  contents: read
  packages: write   # <-- ЭТО ГЛАВНОЕ

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --exclude=migrations

      - name: Run tests
        run: python manage.py test
        env:
          DEBUG: 'False'
          SECRET_KEY: 'dummy-test-secret-key-12345'
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/home_35_2
            docker compose -f docker-compose.prod.yml down
            docker pull ghcr.io/${{ github.repository }}:latest
            echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" > .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS=${{ secrets.SERVER_IP }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
            docker compose -f docker-compose.prod.yml up -d
            
