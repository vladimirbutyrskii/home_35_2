name: CI/CD Pipeline

on:
  push:
    branches: [ feature/home_33 ]
  pull_request:
    branches: [ feature/home_33 ]

env:
  DOCKER_IMAGE: your-dockerhub-username/home_33
  DOCKER_TAG: latest

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8 black

      - name: Lint with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --exclude=migrations

      - name: Run tests
        run: python manage.py test
        env:
          DEBUG: 'False'
          SECRET_KEY: 'dummy-for-tests'

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/home_33
            docker compose -f docker-compose.prod.yml down
            docker pull ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
            echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" > .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS=${{ secrets.SERVER_IP }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
            docker compose -f docker-compose.prod.yml up -d
            
